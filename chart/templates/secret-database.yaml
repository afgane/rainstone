{{- if not .Values.database.existingSecret }}
{{- $name := include "rainstone.databaseSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else if .Values.database.passwordSecret }}
{{- $password = index (lookup "v1" "Secret" .Release.Namespace .Values.database.passwordSecret).data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $host := printf "%s-postgres" (include "rainstone.fullname" .) }}
{{- if eq .Values.database.provider "cnpg" }}
{{- $host = printf "%s-rw" $host }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
    {{- if eq .Values.database.provider "cnpg" }}
    cnpg.io/reload: "true"
    {{- end }}
  annotations:
    # Keep the credential and its data when the release is removed.
    helm.sh/resource-policy: keep
type: {{ ternary "kubernetes.io/basic-auth" "Opaque" (eq .Values.database.provider "cnpg") }}
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ $password | quote }}
  dsn: postgresql+psycopg://{{ .Values.database.user }}:{{ $password }}@{{ $host }}:5432/{{ .Values.database.name }}
{{- end }}
