name: Publish Helm chart

# Called only after the tested commit's image is published. A branch image
# dispatch does not publish a chart. Changed chart contents require a new
# chart version; existing version packages are never overwritten.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      HELM_UPDATER_APP_ID:
        required: true
      HELM_UPDATER_PKEY:
        required: true
  workflow_dispatch: {}

concurrency:
  group: publish-chart
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: azure/setup-helm@v4

      - name: Lint the chart
        run: make chart-lint

      - uses: docker/setup-buildx-action@v3

      - name: Require the application image before publishing its chart
        run: |
          app_version=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' chart/Chart.yaml)
          test -n "$app_version"
          docker buildx imagetools inspect "afgane/rainstone:$app_version" >/dev/null

      - name: Generate GitHub App token (CloudVE)
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HELM_UPDATER_APP_ID }}
          private-key: ${{ secrets.HELM_UPDATER_PKEY }}
          owner: CloudVE
          repositories: helm-charts

      - name: Push to CloudVE/helm-charts
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # Another repository publishes here too; start over from the latest
          # master when a push loses that race.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/helm-charts"
            git clone --depth 1 \
              "https://x-access-token:${APP_TOKEN}@github.com/CloudVE/helm-charts.git" \
              "$RUNNER_TEMP/helm-charts"
            package=$(scripts/publish_chart.sh chart "$RUNNER_TEMP/helm-charts")
            if [ "$package" = unchanged ]; then
              echo "The published chart already matches ${SOURCE_SHA::7}."
              exit 0
            fi
            cd "$RUNNER_TEMP/helm-charts"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$package" index.yaml
            git commit -m "Publish ${package%.tgz} from ${GITHUB_REPOSITORY}@${SOURCE_SHA::7}"
            if git push origin HEAD:master; then
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 10))
          done
          echo "Could not push to CloudVE/helm-charts after 3 attempts." >&2
          exit 1
