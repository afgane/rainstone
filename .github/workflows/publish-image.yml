name: Publish image

# Main commits publish a SHA image after CI, and publish the application
# version tag only once. Bump appVersion for a new application release.
# Manual branch dispatches publish only a SHA image for PR validation.
# The chart publisher runs afterward for the same tested main commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: afgane/rainstone
  # A pull request from a fork's main branch also matches the branch filter,
  # which is why the job checks the triggering event below.
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    outputs:
      main_release: ${{ steps.version.outputs.main_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Read the chart's appVersion
        id: version
        run: |
          app_version=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' chart/Chart.yaml)
          test -n "$app_version"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "main_release=${{ github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether the version tag is already published
        id: release
        if: steps.version.outputs.main_release == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$APP_VERSION" > /tmp/image.json 2> /tmp/image-error; then
            echo "Version $APP_VERSION already exists; publishing the SHA image only."
            echo "publish_tag=false" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown' /tmp/image-error; then
            echo "publish_tag=true" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/image-error >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
            ${{ steps.release.outputs.publish_tag == 'true' && format('{0}:{1}', env.IMAGE, steps.version.outputs.app_version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    needs: publish
    if: needs.publish.outputs.main_release == 'true'
    uses: ./.github/workflows/publish-chart.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
